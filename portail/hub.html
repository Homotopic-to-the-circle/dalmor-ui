<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Portail MJ</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icons/48.png">
<style>
@font-face{font-family:"PMJ Fell";src:url(fonts/im-fell-english-sc-latin-400-normal.woff2)}
@font-face{font-family:"PMJ Alegreya";src:url(fonts/alegreya-latin-400-normal.woff2)}
@font-face{font-family:"PMJ Alegreya";font-style:italic;src:url(fonts/alegreya-latin-400-italic.woff2)}
@font-face{font-family:"PMJ Alegreya";font-weight:700;src:url(fonts/alegreya-latin-700-normal.woff2)}
:root{--disp:"PMJ Fell",Georgia,serif;--body:"PMJ Alegreya",Georgia,serif}
/* JOUR = MJ / Fiches */
.jour{--bg:#efe2c2;--bg-edge:#dcc79a;--card:#f6ecd4;--card2:#fbf4e4;--fg:#2a1c12;--muted:#6e5a44;--faint:#9c8565;
  --acc:#7a1c12;--line:#cdb68c;--soft:rgba(122,28,18,.07);--rule:rgba(122,28,18,.14);--on-acc:#fbf4e4;
  --sh:0 1px 0 rgba(255,255,255,.65) inset,0 1px 2px rgba(80,50,20,.10),0 6px 18px rgba(80,50,20,.10);
  --sh-press:0 1px 0 rgba(255,255,255,.65) inset,0 1px 2px rgba(80,50,20,.14);--grain:.10;color-scheme:light}
/* NUIT = Sonerezh */
.nuit{--bg:#070d1c;--bg-edge:#03060e;--card:#0e1830;--card2:#132042;--fg:#ece3cc;--muted:#8a93a9;--faint:#5b6479;
  --acc:#cfa955;--line:rgba(207,169,85,.38);--soft:rgba(207,169,85,.10);--rule:rgba(207,169,85,.18);--on-acc:#0a1224;
  --sh:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(207,169,85,.16),0 8px 24px rgba(0,0,0,.35);
  --sh-press:inset 0 0 0 3px var(--card2),inset 0 0 0 4px rgba(207,169,85,.3);--grain:.05;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;height:100%}
body{background-color:var(--bg);color:var(--fg);font:18px/1.4 var(--body);user-select:none;overflow-x:hidden;
  background-image:radial-gradient(ellipse 85% 75% at 50% 42%,transparent 55%,var(--bg-edge) 100%);background-attachment:fixed}
/* grain de papier */
.paper{position:fixed;inset:0;pointer-events:none;opacity:var(--grain);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.nuit .paper{mix-blend-mode:screen}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
svg{display:block}

.page{position:relative;min-height:100%;display:flex;flex-direction:column;max-width:1320px;margin:0 auto;padding:18px 40px 22px}
.top{display:flex;align-items:center;gap:14px;min-height:56px}
.date{flex:1;font-family:var(--disp);color:var(--muted);font-size:1.15rem;letter-spacing:.04em}
.date b{color:var(--acc);font-weight:400;margin-left:10px;font-size:1.35rem}
.outil{display:flex;align-items:center;gap:9px;height:52px;padding:0 16px;border:1px solid var(--line);border-radius:3px;color:var(--acc);font-family:var(--disp);font-size:1.05rem}
.outil svg{width:22px;height:22px}
.outil:active{background:var(--soft)}
.outil.on{background:var(--soft);border-color:var(--acc)}

main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:10px 0 18px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.sceau{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;color:#ecd08a;margin-bottom:14px;
  background:radial-gradient(circle at 42% 34%,#a8382a 0%,#7a1c12 48%,#4e0f09 100%);border:2px solid #cfa955;
  box-shadow:inset 0 0 0 7px rgba(78,15,9,.55),inset 0 0 0 8px rgba(236,208,138,.5),0 3px 4px rgba(0,0,0,.2),0 10px 26px rgba(30,10,5,.35)}
.sceau svg{width:54px;height:54px;filter:drop-shadow(0 1px 0 rgba(40,8,4,.7))}
h1{font-family:var(--disp);font-weight:400;color:var(--acc);font-size:4.4rem;line-height:1;margin:0;letter-spacing:.05em}
.orn{display:flex;align-items:center;gap:14px;width:min(520px,80%);margin:14px 0 10px;color:var(--acc)}
.orn span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--acc))}
.orn span:last-child{background:linear-gradient(90deg,var(--acc),transparent)}
.orn i{width:9px;height:9px;transform:rotate(45deg);background:var(--acc)}
.sous{font-family:var(--disp);color:var(--muted);letter-spacing:.14em;font-size:1.15rem;margin:0}

.cadre{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--sh)}
.recherche{display:flex;align-items:center;gap:18px;width:min(900px,100%);margin:0 auto;height:80px;padding:0 24px;text-align:left}
.recherche svg{width:32px;height:32px;color:var(--acc);flex:none}
.recherche span{flex:1;color:var(--faint);font-style:italic;font-size:1.4rem}
.recherche em{font-style:normal;font-family:var(--disp);color:var(--acc);border:1px solid var(--line);border-radius:3px;padding:4px 12px;font-size:1rem}
.recherche:active{box-shadow:var(--sh-press);transform:translateY(1px)}

.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.app{position:relative;height:208px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:transform .08s}
.app:active{transform:translateY(2px);box-shadow:var(--sh-press);background:var(--card2)}
.med{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:var(--acc);border:1px solid var(--acc);
  box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--line)}
.med svg{width:48px;height:48px}
.nom{font-family:var(--disp);font-size:1.9rem;letter-spacing:.03em;line-height:1}
.etat{font-style:italic;color:var(--faint);font-size:1rem;display:flex;align-items:center;gap:7px;min-height:22px}
.app.ouvert .etat{color:var(--acc)}
.app.ouvert .etat::before{content:"";width:7px;height:7px;background:var(--acc);transform:rotate(45deg)}
.app.ouvert .med{background:var(--soft)}

.onglets h2{font-family:var(--disp);font-weight:400;color:var(--acc);font-size:1.35rem;margin:0 0 6px;padding-bottom:5px;border-bottom:2px solid var(--acc);letter-spacing:.02em}
.nuit .onglets h2{border:0;background:linear-gradient(90deg,var(--acc) 0%,var(--acc) 55%,transparent 100%) bottom/100% 2px no-repeat}
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));column-gap:28px}
.ong{display:flex;align-items:center;min-height:58px;border-bottom:1px solid var(--rule)}
.ong .t{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;text-align:left;padding-left:4px}
.ong .t:active{background:var(--soft)}
.ong .t svg,.ong img{width:24px;height:24px;flex:none;color:var(--acc)}
.ong .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ong .lab b{font-family:var(--disp);font-weight:400;color:var(--acc);margin-right:6px}
.ong .lab i{color:var(--muted)}
.ong .son{color:var(--acc);font-style:italic;font-size:.9rem;margin-left:8px;flex:none}
.x{width:56px;height:56px;flex:none;display:grid;place-items:center;color:var(--faint);border-radius:3px}
.x svg{width:22px;height:22px}
.x:active{color:var(--acc);background:var(--soft)}
.x.sur{width:auto;padding:0 12px;color:var(--acc);border:1px solid var(--acc);font-family:var(--disp)}
.vide{color:var(--faint);font-style:italic;padding:14px 4px}
footer{text-align:center;color:var(--faint);font-style:italic;font-size:.95rem;padding-top:6px}
</style>
</head>
<body class="jour">
<div class="paper"></div>
<div class="page">
  <header class="top">
    <div class="date" id="date"></div>
    <button class="outil" data-a="last" id="b-last"></button>
    <button class="outil" data-a="fs" id="b-fs"></button>
    <button class="outil" data-a="options" id="b-opt"></button>
  </header>
  <main>
    <section class="hero">
      <div class="sceau" id="sceau"></div>
      <h1>Portail</h1>
      <div class="orn"><span></span><i></i><span></span></div>
      <p class="sous">TABLE DU MAÎTRE DU JEU</p>
    </section>
    <button class="recherche cadre" id="search"><b id="s-ic"></b><span>Rechercher un sort, un monstre, un objet, une règle…</span><em>AideDD 5.5</em></button>
    <section class="apps" id="apps"></section>
    <section class="onglets"><h2>Onglets ouverts</h2><div class="liste" id="tabs"></div></section>
  </main>
  <footer>Appui long sur le sceau rouge : retour à l'onglet précédent · Alt+Q au clavier</footer>
</div>
<script src="icons.js"></script>
<script src="hub.js"></script>
<script src="dock.js"></script>
</body>
</html>
